<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="bimbimbambam — giao diện chat gọn nhẹ, mượt mà.">
  <title>bimbimbambam — Tin nhắn</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x2='1' y2='1'%3E%3Cstop stop-color='%237b67f4'/%3E%3Cstop offset='1' stop-color='%2336a8ef'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='20' fill='url(%23g)'/%3E%3Cpath d='M13 40 25 20l8 12 7-8 11 18-15-8-6 7-6-8z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="rail" aria-label="Điều hướng chính">
      <a class="brand-mark" href="#" aria-label="bimbimbambam, trang chủ">
        <svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8069f5"/><stop offset="1" stop-color="#3ba8ef"/></linearGradient></defs><rect width="48" height="48" rx="16" fill="url(#brandGradient)"/><path d="m10 33 9-19 6 11 5-7 8 18-11-9-5 7-5-8z" fill="white"/></svg>
      </a>
      <button class="rail-button active" aria-label="Tin nhắn" title="Tin nhắn"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5 8 8 0 0 1-3.4-.8L4 20l1.5-4A7.5 7.5 0 1 1 20 11.5Z"/><path d="m8 13 2.4-2.5 2 1.5 3.6-2"/></svg></button>
      <button class="rail-button" id="peopleButton" aria-label="Danh bạ" title="Danh bạ"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 5.5a3 3 0 0 1 0 5.8M17 14a4.5 4.5 0 0 1 3.5 4.4"/></svg></button>
      <div class="rail-spacer"></div>
      <button class="rail-button" id="themeButton" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện"><svg viewBox="0 0 24 24"><path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z"/></svg></button>
      <button class="profile-button" id="profileButton" aria-label="Tài khoản của bạn"><span class="avatar avatar-self">B</span><i class="online-dot"></i></button>
    </aside>

    <section class="inbox-panel" aria-label="Danh sách cuộc trò chuyện">
      <header class="inbox-header">
        <div class="heading-row"><div><p class="eyebrow">KHÔNG GIAN CỦA BẠN</p><h1>Tin nhắn</h1></div><button class="icon-button compose-button" id="composeButton" aria-label="Tạo tin nhắn mới" title="Tin nhắn mới"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <label class="search-box"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4 4"/></svg><input id="searchInput" type="search" placeholder="Tìm kiếm cuộc trò chuyện" autocomplete="off"><kbd>⌘ K</kbd></label>
        <div class="filter-row" role="group" aria-label="Lọc tin nhắn"><button class="filter-chip selected" data-filter="all">Tất cả <span id="allCount">6</span></button><button class="filter-chip" data-filter="unread">Chưa đọc</button><button class="filter-chip" data-filter="groups">Nhóm</button></div>
      </header>
      <div class="section-label"><span>GẦN ĐÂY</span><button class="subtle-button" id="sortButton">Mới nhất <span>⌄</span></button></div>
      <div class="conversation-list" id="conversationList" role="list"></div>
      <footer class="inbox-footer"><span class="sync-dot"></span><span id="syncStatus">Sẵn sàng đồng bộ</span><button aria-label="Thông tin đồng bộ" title="Ứng dụng chạy trên thiết bị này">ⓘ</button></footer>
    </section>

    <main class="chat-panel" aria-label="Cuộc trò chuyện">
      <div class="welcome-state" id="welcomeState"><div class="welcome-art"><div class="art-orbit orbit-one"></div><div class="art-orbit orbit-two"></div><div class="welcome-bubble"><svg viewBox="0 0 48 48"><path d="M39 22.5a15 15 0 0 1-15 15 16 16 0 0 1-6.8-1.6L7 39l3-8a15 15 0 1 1 29-8.5Z"/><path d="m16 25 5-5 4 3 7-4"/></svg></div><span class="spark spark-a">✳</span><span class="spark spark-b">✦</span></div><p class="eyebrow">NHẸ NHÀNG KẾT NỐI</p><h2>Một cuộc trò chuyện<br>đang chờ bạn.</h2><p class="welcome-copy">Chọn một người bạn bên trái để bắt đầu.<br>Không rối mắt, chỉ tập trung vào điều quan trọng.</p><button class="primary-button" id="welcomeCompose">Bắt đầu trò chuyện <span>→</span></button><p class="demo-note">bimbimbambam · tin nhắn được lưu trên thiết bị</p></div>
      <div class="active-chat hidden" id="activeChat">
        <header class="chat-header"><div class="chat-person"><div class="avatar-wrap"><span class="avatar" id="headerAvatar">L</span><i class="online-dot" id="headerOnline"></i></div><div><h2 id="headerName">Linh Trần</h2><p id="headerStatus">Đang hoạt động</p></div></div><div class="header-actions"><button class="icon-button" id="callButton" aria-label="Gọi thoại" title="Gọi thoại"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a14 14 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg></button><button class="icon-button" id="videoButton" aria-label="Gọi video" title="Gọi video"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3"/></svg></button><span class="action-divider"></span><button class="icon-button" id="infoButton" aria-label="Thông tin cuộc trò chuyện" title="Thông tin"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button></div></header>
        <div class="message-area" id="messageArea" aria-live="polite"></div>
        <form class="composer" id="messageForm"><div class="composer-tools"><button type="button" class="tool-button" id="emojiButton" aria-label="Chèn biểu tượng cảm xúc" title="Biểu tượng cảm xúc">☺</button><button type="button" class="tool-button" id="attachButton" aria-label="Đính kèm" title="Đính kèm">＋</button></div><label class="message-input-wrap"><input id="messageInput" type="text" placeholder="Viết tin nhắn..." autocomplete="off" aria-label="Nội dung tin nhắn"><span>Enter ↵</span></label><button class="send-button" type="submit" aria-label="Gửi tin nhắn" title="Gửi tin nhắn"><svg viewBox="0 0 24 24"><path d="m21 3-7.5 18-3.8-7.7L2 9.5 21 3Z"/><path d="M9.7 13.3 21 3"/></svg></button></form>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  </div>
  <input id="fileInput" type="file" hidden accept="image/*,.pdf,.txt,.zip">
  <script src="app.js"></script>
</body>
</html>
